name: CNS Lab CTF Evaluator & Scoreboard

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'challenges/**'
  push:
    branches:
      - main
    paths:
      - 'challenges/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  evaluate-flag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome pytest

      - name: Run Challenge Evaluators
        env:
          EXPECTED_FLAG_CHALLENGE_1: ${{ secrets.CHALLENGE_1_SECRET_FLAG }}
        run: |
          pytest .tests/ -v --tb=short

      - name: Comment PR Success
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🎉 **Challenge Passed!** Merge this PR into `main` to update your score on the SCOREBOARD.'
            })

      - name: Comment PR Failure
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Verification Failed.** Your solution did not produce the expected flag. Please double-check your implementation.'
            })

      - name: Update SCOREBOARD.md on Merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        env:
          COMMIT_AUTHOR: ${{ github.actor }}
        run: |
          python .tests/update_scoreboard.py
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add SCOREBOARD.md
          if ! git diff --staged --quiet; then
            git commit -m "trophy: Update SCOREBOARD.md for @${COMMIT_AUTHOR}"
            git push
          fi
